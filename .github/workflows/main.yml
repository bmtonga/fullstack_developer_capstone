name: 'Lint Code'

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Print working directory
      run: pwd

    - name: Run Linter
      run: |
        flake8 . --exclude=*/migrations/*,.git,__pycache__,venv,.venv \
                 --max-line-length=120 \
                 --ignore=W292,W293,E303,W191,E101,E131,W391
        echo "Linted all the python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install JSHint
      run: npm install jshint --global

    - name: Run Linter
      run: |
        # Generate a temporary .jshintrc file with ES8 and laxbreak enabled
        echo '{"esversion": 8, "node": true, "laxbreak": true}' > .jshintrc
        find ./server/database -name "*.js" -exec jshint --config .jshintrc {} +
        echo "Linted all the js files successfully"
